services:
  paludariumpi:
    image: theyosh/paludariumpi:latest # Or use a specific version
    volumes:
      - /opt/paludariumpi/logs:/PaludariumPI/log
      - /opt/paludariumpi/data:/PaludariumPI/data
      - /opt/paludariumpi/media:/PaludariumPI/media
      - /opt/paludariumpi/scripts:/PaludariumPI/scripts
      - /opt/paludariumpi/webcam-archive:/PaludariumPI/webcam/archive
      - /opt/paludariumpi/DenkoviRelayCommandLineTool:/PaludariumPI/3rdparty/DenkoviRelayCommandLineTool

      - /boot/config.txt:/boot/config.txt # For Buster and Bullseye
      - /boot/cmdline.txt:/boot/cmdline.txt # For Buster and Bullseye

      - /boot/firmware/config.txt:/boot/firmware/config.txt # For Bookworm
      - /boot/firmware/cmdline.txt:/boot/firmware/cmdline.txt # For Bookworm
      - /run/udev:/run/udev # For Bookworm

      - /etc/modules:/etc/modules
      - /dev:/dev
    network_mode: host
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
    stop_grace_period: 1m
    stop_signal: SIGINT
    init: true
    environment:
      TZ: "Europe/Amsterdam" # timezone list can be found here https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      ENABLE_I2C: "true"
      ENABLE_1_WIRE: "true"
      ENABLE_CAMERA: "true"
      ENABLE_SERIAL: "true"
      ENABLE_CO2_SENSORS: "true"
      AUTO_REBOOT: "true"
